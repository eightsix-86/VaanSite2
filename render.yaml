# ============================================================
# Render Blueprint — free-tier deployment for the Vaan Bakes API
# ============================================================
# How to use:
#   1. Create a free PostgreSQL database on Supabase (already done —
#      schema applied + seeded).
#   2. Create a free Web Service on Render:
#        New + → Blueprint → connect this repo.
#      Render reads render.yaml (at the repo root) and provisions
#      the service.
#   3. Set DATABASE_URL and ADMIN_PASSWORD as environment variables
#      in the Render dashboard (sync: false means you set them
#      yourself — they never live in the repo).
#   4. Deploy. The API is live at:
#        https://<service-name>.onrender.com/api/products
#
# Uses the Docker runtime with build context at the repo root (`.`)
# and vaan-bakes/backend/Dockerfile, which bundles BOTH the backend
# and the static frontend into the image, so the deployed service
# can serve the site and API from one instance.
# ============================================================

services:
  - type: web
    name: vaan-bakes-api
    runtime: docker
    rootDir: .
    plan: free
    dockerfilePath: vaan-bakes/backend/Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false            # set in the Render dashboard
      - key: ADMIN_PASSWORD
        sync: false            # set in the Render dashboard
      - key: CORS_ORIGIN
        value: "*"
      - key: PORT
        value: 4000

