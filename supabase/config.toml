# Supabase project configuration.
# Docs: https://supabase.com/docs/reference/cli/config

project_id = "vaan-bakes"

# The API is served from your Express backend, not from Supabase's
# auto-generated REST API, so we keep the generated schema APIs disabled.
api:
  enabled = false
  schemas = ["public"]
  extra_search_path = ["public", "extensions"]

# Database migration settings — the linked GitHub repo will run
# supabase/migrations/*.sql on push (via the Supabase GitHub App).
db:
  port = 5432
  shadow_port = 54320
  major_version = 15

[studio]
enabled = true
port = 54323

# [auth] — not used by Vaan Bakes (admin auth is handled by the Express
# backend via ADMIN_PASSWORD). Left disabled to avoid exposing extra tables.
[auth]
enabled = false

[analytics]
enabled = false

