version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: vaan-bakes/backend/Dockerfile
    container_name: vaan-bakes-backend
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: vaan-bakes-prometheus
    volumes:
      - ./vaan-bakes/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: vaan-bakes-grafana
    volumes:
      - ./vaan-bakes/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./vaan-bakes/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:

